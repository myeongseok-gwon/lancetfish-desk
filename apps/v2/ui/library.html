<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div id="top"></div>
<main class="lib" id="lib">
  <div class="search-wrap">
    <label class="search">
      <span class="icon" id="searchIcon"></span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search papers, highlights, chats, decks, notes" aria-label="Search the library">
      <button class="clear" id="clear" aria-label="Clear"></button>
    </label>
    <div class="lib-stats" id="stats">&nbsp;</div>
  </div>
  <div class="toolbar">
    <div class="chips" id="types" role="group" aria-label="Filter"></div>
    <div class="seg" id="sort" role="group" aria-label="Sort"></div>
  </div>
  <div id="out"></div>
</main>
<script type="module" src="/ui/library.js"></script>
</body>
</html>
